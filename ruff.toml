target-version = "py313"
line-length = 88

[lint]
select = [
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "N",
    "PL",
    "RUF",
    "SIM",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "D203",
    "D213",
    "TRY003",
    "TRY400",
]

[lint.per-file-ignores]
"tests/*" = ["D100", "D103", "PLR0915", "PLR2004"]

[lint.pydocstyle]
convention = "pep257"
