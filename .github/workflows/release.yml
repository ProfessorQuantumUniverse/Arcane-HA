name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check the tag against the manifest and the changelog
        run: python scripts/release.py check "${{ github.ref_name }}"

      - name: Run the tests
        run: |
          pip install -r requirements_test.txt
          python -m pytest

      - name: Collect the release notes
        run: |
          {
            echo "notes<<RELEASE_NOTES_EOF"
            python scripts/release.py notes "${{ github.ref_name }}"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "A release for ${{ github.ref_name }} already exists, so it was" \
                 "written by hand. Leaving its notes alone."
            exit 0
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "$notes"
